<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180">
  <defs>
    <style>
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .line-1 { animation: fadeIn 0.6s ease-out 0.2s both; }
      .line-2 { animation: fadeIn 0.6s ease-out 0.4s both; }
      .line-3 { animation: fadeIn 0.6s ease-out 0.6s both; }

      text { font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; }

      /* Dark mode (default) */
      .title-text { fill: #e6edf3; font-weight: 700; font-size: 24px; }
      .tag-text { fill: #8b949e; font-weight: 500; font-size: 14px; letter-spacing: 0.5px; }
      .tag-dot { fill: #7B68EE; }
      .metric-value { fill: #9d8cff; font-weight: 700; font-size: 34px; }
      .metric-label { fill: #8b949e; font-weight: 400; font-size: 13px; }
      .sep { stroke: #30363d; }

      /* Light mode */
      @media (prefers-color-scheme: light) {
        .title-text { fill: #1f2328; }
        .tag-text { fill: #57606a; }
        .tag-dot { fill: #5B4ACF; }
        .metric-value { fill: #5B4ACF; }
        .metric-label { fill: #57606a; }
        .sep { stroke: #d0d7de; }
      }
    </style>
  </defs>

  <!-- Line 1: University -->
  <g class="line-1">
    <text x="400" y="42" text-anchor="middle" class="title-text">工学部 電気電子工学科</text>
  </g>

  <!-- Line 2: Specialties -->
  <g class="line-2">
    <text x="400" y="74" text-anchor="middle" class="tag-text">Game Dev<tspan class="tag-dot">  ·  </tspan>Mobile<tspan class="tag-dot">  ·  </tspan>Full-Stack<tspan class="tag-dot">  ·  </tspan>Cloud<tspan class="tag-dot">  ·  </tspan>AI / ML</text>
  </g>

  <!-- Line 3: Metrics -->
  <g class="line-3">
    <g transform="translate(220, 136)">
      <text x="0" y="0" text-anchor="middle" class="metric-value">4000+</text>
      <text x="0" y="24" text-anchor="middle" class="metric-label">Chrome ユーザー</text>
    </g>
    <line x1="310" y1="106" x2="310" y2="160" class="sep" stroke-width="1"/>
    <g transform="translate(400, 136)">
      <text x="0" y="0" text-anchor="middle" class="metric-value">11</text>
      <text x="0" y="24" text-anchor="middle" class="metric-label">プログラミング言語</text>
    </g>
    <line x1="490" y1="106" x2="490" y2="160" class="sep" stroke-width="1"/>
    <g transform="translate(580, 136)">
      <text x="0" y="0" text-anchor="middle" class="metric-value">4</text>
      <text x="0" y="24" text-anchor="middle" class="metric-label">社インターン</text>
    </g>
  </g>
</svg>
