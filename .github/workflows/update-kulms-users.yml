name: Update KULMS+ User Count

on:
  schedule:
    - cron: '0 0 * * *' # 毎日 UTC 0:00 に実行
  workflow_dispatch: # 手動トリガー

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch user count from Chrome Web Store
        id: fetch
        run: |
          JSON=$(curl -sf "https://img.shields.io/chrome-web-store/users/akfadmompgbhncnocomalofhcihpejjb.json" || true)
          VALUE=$(echo "$JSON" | jq -r '.value // empty' 2>/dev/null || true)
          echo "raw=$VALUE" >> "$GITHUB_OUTPUT"

          # Parse abbreviated value: "4k" -> 4000, "12.5k" -> 12500, "1M" -> 1000000
          if [[ "$VALUE" == *k ]]; then
            NUM=$(echo "$VALUE" | sed 's/k//' | awk '{printf "%.0f", $1 * 1000}')
          elif [[ "$VALUE" == *M ]]; then
            NUM=$(echo "$VALUE" | sed 's/M//' | awk '{printf "%.0f", $1 * 1000000}')
          else
            NUM=$(echo "$VALUE" | tr -d ', ')
          fi

          # 取得できなかった場合は何も書き換えない（前回の値を残す）
          if ! [[ "$NUM" =~ ^[0-9]+$ ]] || [ "$NUM" -eq 0 ]; then
            echo "Failed to fetch user count (value: '$VALUE'). Skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "num=$NUM" >> "$GITHUB_OUTPUT"

          # Comma-formatted: 4000 -> 4,000
          FORMATTED=$(printf "%'d" "$NUM")
          echo "formatted=$FORMATTED" >> "$GITHUB_OUTPUT"

      - name: Update README.md
        if: steps.fetch.outputs.ok == 'true'
        env:
          NUM: ${{ steps.fetch.outputs.num }}
          FORMATTED: ${{ steps.fetch.outputs.formatted }}
        run: |
          # 1. Typing SVG URL: KULMS%2B+%7C+XXXX%2B+Users
          sed -i -E "s/KULMS%2B\+%7C\+[0-9]+%2B\+Users/KULMS%2B+%7C+${NUM}%2B+Users/g" README.md

          # 2. "**N人以上**" pattern
          sed -i -E "s/\*\*[0-9]+人以上\*\*/\*\*${NUM}人以上\*\*/g" README.md

          # 3. "N,NNN人以上のアクティブユーザー" pattern
          sed -i -E "s/[0-9,]+人以上のアクティブユーザー/${FORMATTED}人以上のアクティブユーザー/g" README.md

          # 4. "<b>N+ users</b>" pattern
          sed -i -E "s/<b>[0-9,]+\+ users<\/b>/<b>${NUM}+ users<\/b>/g" README.md

      - name: Update hero-banner.svg
        if: steps.fetch.outputs.ok == 'true'
        env:
          NUM: ${{ steps.fetch.outputs.num }}
        run: |
          # 5. Metric value in SVG: >XXXX+<
          sed -i -E "s/(class=\"metric-value\">)[0-9,]+\+/\1${NUM}+/g" assets/hero-banner.svg

      # バッジはリポジトリ内に保存し、README からは外部サービスを直接参照しない
      # （外部が落ちていても壊れた画像が出ないようにするため）
      - name: Update KULMS+ users badge
        if: steps.fetch.outputs.ok == 'true'
        env:
          RAW: ${{ steps.fetch.outputs.raw }}
        run: |
          if curl -sf "https://img.shields.io/badge/KULMS%2B%20Users-${RAW}-4285F4?style=for-the-badge&logo=googlechrome&logoColor=white" -o /tmp/badge.svg \
            && grep -q '^<svg' /tmp/badge.svg; then
            mv /tmp/badge.svg assets/badges/kulms-users.svg
          else
            echo "Failed to render users badge. Keeping previous one."
          fi

      - name: Update followers badge
        run: |
          FOLLOWERS=$(curl -sf -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/users/${{ github.repository_owner }}" | jq -r '.followers // empty' || true)
          if ! [[ "$FOLLOWERS" =~ ^[0-9]+$ ]]; then
            echo "Failed to fetch followers. Keeping previous badge."
            exit 0
          fi
          if curl -sf "https://img.shields.io/badge/Followers-${FOLLOWERS}-7B68EE?style=for-the-badge" -o /tmp/badge.svg \
            && grep -q '^<svg' /tmp/badge.svg; then
            mv /tmp/badge.svg assets/badges/followers.svg
          else
            echo "Failed to render followers badge. Keeping previous one."
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/hero-banner.svg assets/badges
          if git diff --staged --quiet; then
            echo "No changes detected"
          else
            git commit -m "chore: update KULMS+ user count and badges"
            git push
          fi
